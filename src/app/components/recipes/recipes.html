<div class="recipes-container">
@for(recipe of recipes; track recipe.idMeal) {
  <div class="recipe-card">
    <img [src]="recipe.strMealThumb" [alt]="recipe.strMeal"/>
    <div class="content">
      <h2> {{ recipe.strMeal }} </h2>
      <p> {{ recipe.strCategory }} </p>
    </div>
  </div>
}
</div>
